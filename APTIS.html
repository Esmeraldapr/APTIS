<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREPARACIÓN APTIS</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .header-info { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; font-weight: bold; position: sticky; top: 0; background: white; z-index: 100; padding-top: 10px;}
        #timer { color: var(--error); font-size: 1.2rem; }
        
        /* Estilos del Menú por bloques */
        .subject-block { background: #fdfdfd; border: 2px solid #e1e8ed; border-radius: 12px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .subject-title { color: var(--primary); font-size: 1.5rem; margin-top: 0; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid var(--secondary); text-align: left; }
        .topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        
        .menu-btn { background: var(--secondary); color: white; border: none; padding: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .menu-btn:hover { background: #2980b9; transform: translateY(-2px); }
        .menu-btn.failed { background: #e67e22; width: 100%; margin-top: 10px; font-size: 1.1rem; }
        .menu-btn.failed:hover { background: #d35400; }
        .btn-danger { background: var(--error); width: auto; font-size: 0.9rem; padding: 8px 15px; margin-bottom: 15px; }
        .btn-danger:hover { background: #c0392b; }
        
        /* Tarjetas de preguntas */
        .question-block { background: #fff; border: 1px solid #e1e8ed; border-radius: 10px; padding: 25px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 20px; }
        
        .options-container { display: grid; gap: 12px; margin-top: 20px; }
        .option-btn { padding: 15px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: white; text-align: left; font-size: 1.05rem; }
        .option-btn:hover:not(:disabled) { background: #f8f9fa; border-color: var(--secondary); }
        
        /* Estados de Validación */
        .correct { background-color: var(--success) !important; color: white; border-color: var(--success); font-weight: bold; }
        .wrong { background-color: var(--error) !important; color: white; border-color: var(--error); }
        
        /* =========================================================================
           ¡NUEVO SISTEMA ANTES/DESPUÉS PARA LA TRADUCCIÓN OOCULTA!
           ========================================================================= */
        .translation-box { 
            background-color: #e8f4fd !important; 
            border-left: 5px solid var(--secondary) !important; 
            color: #2c3e50; 
            cursor: pointer; 
            font-weight: normal; 
            transition: all 0.3s ease;
        }
        /* Al pasar el ratón o hacer clic, cambia el diseño y muestra el texto real */
        .translation-box:hover, .translation-box:active {
            background-color: #d4e6f1 !important;
        }

        .btn-main { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; width: 100%; margin-top: 25px; }
        .btn-main:hover { background: #1a252f; }
        .back-btn { padding: 6px 12px; border: none; border-radius: 6px; background: var(--secondary); color: white; font-weight: bold; cursor: pointer; margin-right: 10px; }
        
        .result-panel { background: #fff; border: 2px solid #eee; padding: 30px; border-radius: 12px; text-align: center; margin-top: 30px; display: none; }
        
        .select-aptis-generic { padding: 10px; border-radius: 6px; border: 2px solid var(--secondary); font-size: 1rem; width: 100%; margin-top: 10px; }
    </style>
</head>

    <div id="login-section">

        <div style="text-align: center;">

            <button class="menu-btn failed" onclick="startFailedQuestionsTest()">

            </button>
        </div>
        
        <div id="subjects-container" style="margin-top: 30px;"></div>

    <!-- PANTALLA DE TEST -->
    <div id="test-section" style="display:none;">
        <div class="header-info">

                <div>📚 <span id="display-topic"></span></div>
            </div>
            <div id="timer">⏱️ 00:00</div>
        </div>
        
        <div id="questions-list"></div>
        
        <button id="finish-btn" class="btn-main" onclick="finishTest()">Finalizar Test ➔</button>
    </div>

    <!-- PANTALLA DE RESULTADOS -->
    <div id="results-section" class="result-panel">

        <button class="btn-main" onclick="goBackToMenu()">↻ Volver al Menú Principal</button>
    </div>
</div>

    p: "I definitely _______ to buy a new laptop because my old one is working too slowly.",
    r: ["to need", "to exist", "to include", "to own"],
    c: "to need",
    e: "Traducción: a) necesitar | b) existir | c) incluir | d) poseer"
},

    p: "My grandparents _______ a beautiful villa near the coast where we spend the summer.",
    r: ["to belong", "to change", "to own", "to remain"],
    c: "to own",

},
{

    p: "The patients must _______ in their hospital beds until the doctor grants permission to leave.",
    r: ["to remain", "to dream", "to get better (improve)", "to matter"],
    c: "to remain",
    e: "Traducción: a) continuar, permanecer | b) soñar | c) mejorar | d) importar"
},
{

    p: "I can clearly _______ my first day of primary school; I was very nervous.",
    r: ["to forget", "to guess", "to mean", "to remember"],
    c: "to remember",
    e: "Traducción: a) olvidar | b) adivinar / creer | c) significar | d) recordar"
},
{
    m: "VOCABULARIO", t: "Unit 1: Miscelaneous", u: "TEST 2",
    p: "You look pale and tired today; you _______ to have a terrible headache.",
    r: ["to seem", "to exist", "to include", "to need"],
    c: "to seem",
    e: "Traducción: a) parecer | b) existir | c) incluir | d) necesitar"
}
    ];

    // Variables de Estado
    let currentQuestions = [];
    let userAnswers = {};
    let startTime;
    let timerInterval;
    let selectedBlock = "";

    // Construcción del menú dinámico leyendo m, t, u
    function buildMenu() {
        const container = document.getElementById('subjects-container');
        container.innerHTML = "";

        let tree = {};
        misPreguntas.forEach((q) => {
            if (!tree[q.m]) tree[q.m] = {};
            if (!tree[q.m][q.t]) tree[q.m][q.t] = [];
            if (!tree[q.m][q.t].includes(q.u)) {
                tree[q.m][q.t].push(q.u);
            }
        });

        for (let m in tree) {
            let blockDiv = document.createElement('div');
            blockDiv.className = "subject-block";
            
            let title = document.createElement('h2');
            title.className = "subject-title";
            title.innerText = m;
            blockDiv.appendChild(title);

            for (let t in tree[m]) {
                let topicPara = document.createElement('p');
                topicPara.innerHTML = `<strong>${t}:</strong>`;
                blockDiv.appendChild(topicPara);

                let grid = document.createElement('div');
                grid.className = "topics-grid";

                tree[m][t].forEach(u => {
                    let btn = document.createElement('button');
                    btn.className = "menu-btn";
                    btn.innerText = u;
                    btn.onclick = () => startTest(m, t, u);
                    grid.appendChild(btn);
                });
                blockDiv.appendChild(grid);
            }
            container.appendChild(blockDiv);
        }
    }

    function updateTimer() {
        let now = new Date();
        let diff = now - startTime;
        let mins = Math.floor(diff / 60000);
        let secs = Math.floor((diff % 60000) / 1000);
        document.getElementById('timer').innerText = `⏱️ ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function startTest(m, t, u) {
        selectedBlock = `${m} - ${t} - ${u}`;
        currentQuestions = misPreguntas.filter(q => q.m === m && q.t === t && q.u === u);
        initLayout();
    }

    function initLayout() {
        userAnswers = {};
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('results-section').style.display = 'none';
        document.getElementById('test-section').style.display = 'block';
        document.getElementById('display-topic').innerText = selectedBlock;

        startTime = new Date();
        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);

        renderQuestions();
        window.scrollTo(0,0);
    }

    // Renderizado Dinámico de Preguntas
    function renderQuestions() {
        const listContainer = document.getElementById('questions-list');
        listContainer.innerHTML = "";

        currentQuestions.forEach((q, index) => {
            let qIdx = misPreguntas.indexOf(q); 

            let qBlock = document.createElement('div');
            qBlock.className = "question-block";
            qBlock.id = `qblock-${qIdx}`;

            let qText = document.createElement('div');
            qText.className = "question-text";
            qText.innerText = `${index + 1}. ${q.p}`;
            qBlock.appendChild(qText);

            let optionsDiv = document.createElement('div');
            optionsDiv.className = "options-container";

            if (q.r && q.r.length > 0) {
                q.r.forEach(option => {
                    let btn = document.createElement('button');
                    btn.className = `option-btn opt-${qIdx}`;
                    btn.id = `btn-${qIdx}-${option}`;
                    btn.innerText = option;
                    btn.onclick = () => checkAnswer(qIdx, option, q.c);
                    optionsDiv.appendChild(btn);
                });

                // =========================================================================
                // NUEVA LÓGICA DE INTERFAZ GESTIONADA POR EVENTOS (Oculta hasta interactuar)
                // =========================================================================
                if (q.e) {
                    let transBox = document.createElement('button');
                    transBox.className = "option-btn translation-box";
                    transBox.innerText = `👁️ Ver traducción de las opciones`;
                    
                    // Al hacer clic o pasar el ratón por encima, se muestra el valor de la clave 'e'
                    transBox.onclick = function() {
                        this.innerText = `E) ${q.e}`;
                    };
                    transBox.onmouseover = function() {
                        this.innerText = `E) ${q.e}`;
                    };
                    transBox.onmouseout = function() {
                        this.innerText = `👁️ Ver traducción de las opciones`;
                    };
                    
                    optionsDiv.appendChild(transBox);
                }
            } else {
                let select = document.createElement('select');
                select.className = "select-aptis-generic";
                select.onchange = (e) => checkAnswer(qIdx, e.target.value, q.c);
                
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.innerText = "-- Selecciona la palabra correcta (Futuro Desplegable) --";
                select.appendChild(defaultOpt);

                let mockOpt = document.createElement('option');
                mockOpt.value = q.c;
                mockOpt.innerText = q.c;
                select.appendChild(mockOpt);

                optionsDiv.appendChild(select);
            }

            qBlock.appendChild(optionsDiv);
            listContainer.appendChild(qBlock);
        });
    }

    function checkAnswer(qIdx, selected, correct) {
        if (userAnswers[qIdx]) return; 
        userAnswers[qIdx] = selected;

        let q = misPreguntas[qIdx];
        
        if (q.r && q.r.length > 0) {
            document.querySelectorAll(`.opt-${qIdx}`).forEach(btn => btn.disabled = true);

            if (selected === correct) {
                document.getElementById(`btn-${qIdx}-${selected}`).classList.add('correct');
            } else {
                document.getElementById(`btn-${qIdx}-${selected}`).classList.add('wrong');
                document.getElementById(`btn-${qIdx}-${correct}`).classList.add('correct');
            }
        } else {
            let block = document.getElementById(`qblock-${qIdx}`);
            if (selected === correct) {
                block.style.borderLeft = "10px solid var(--success)";
            } else {
                block.style.borderLeft = "10px solid var(--error)";
            }
        }
    }

    function finishTest() {
        clearInterval(timerInterval);
        let correctas = 0;
        let falladas = JSON.parse(localStorage.getItem('repaso_aptis') || '[]');

        currentQuestions.forEach(q => {
            let idx = misPreguntas.indexOf(q);
            let ans = userAnswers[idx];

            if (ans === q.c) {
                correctas++;
                falladas = falladas.filter(id => id !== idx);
            } else {
                if (!falladas.includes(idx)) falladas.push(idx);
            }
        });

        localStorage.setItem('repaso_aptis', JSON.stringify(falladas));
        updateFailedCount();

        document.getElementById('test-section').style.display = 'none';
        document.getElementById('results-section').style.display = 'block';

        document.getElementById('score-text').innerText = `${correctas}/${currentQuestions.length}`;
        let pct = ((correctas / currentQuestions.length) * 100).toFixed(1);
        document.getElementById('results-detail-text').innerText = `Has obtenido un porcentaje de acierto del ${pct}%. Las preguntas erróneas se han guardado en tu sección de repaso.`;
    }

    function startFailedQuestionsTest() {
        let falladas = JSON.parse(localStorage.getItem('repaso_aptis') || '[]');
        if (falladas.length === 0) {
            alert("¡Gran trabajo! No tienes ningún fallo pendiente de repaso.");
            return;
        }

        selectedBlock = "Repaso de mis Errores Guardados";
        currentQuestions = misPreguntas.filter((_, idx) => falladas.includes(idx));
        initLayout();
    }

    function updateFailedCount() {
        let falladas = JSON.parse(localStorage.getItem('repaso_aptis') || '[]');
        document.getElementById('failed-count').innerText = falladas.length;
    }

    function resetProgress() {
        if (confirm("¿Estás seguro de que deseas borrar todo tu historial de fallos guardados?")) {
            localStorage.removeItem('repaso_aptis');
            updateFailedCount();
        }
    }

    function goBackToMenu() {
        clearInterval(timerInterval);
        document.getElementById('test-section').style.display = 'none';
        document.getElementById('results-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
        updateFailedCount();
    }

    window.onload = function() {
        buildMenu();
        updateFailedCount();
    };
</script>
